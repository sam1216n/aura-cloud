name = "aura-cloud"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
AURA_MODEL = "gemini-3.5-flash-lite"
AURA_IMAGE_MODEL = "cloudflare:flux-2-klein-4b"
AURA_DAILY_LIMIT = "40"
AURA_GLOBAL_DAILY_LIMIT = "500"
AURA_SIGNUP_MODE = "open"

# O instalador cadastra automaticamente [[d1_databases]] aqui.

[ai]
binding = "AI"
